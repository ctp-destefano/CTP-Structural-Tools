<style>
:root{--bg:#171a1f;--panel:#222730;--border:#414957;--text:#edf1f7;--muted:#a7b0be;--red:#d2042d;--green:#65d6a1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#292f3a 0%,var(--bg) 62%)}
#landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.landing-inner{width:min(100%,980px);margin:auto}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:42px}
.brand-mark{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:var(--red);font-size:27px;font-weight:800;box-shadow:0 10px 30px #d2042d35}
.brand h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.2px;margin:0}
.subtitle{text-align:center;color:var(--muted);font-size:16px;margin:-28px 0 36px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tool-card{text-align:left;position:relative;display:flex;flex-direction:column;min-height:240px;padding:28px;background:linear-gradient(145deg,#252b35,#20242c);border:1px solid var(--border);border-radius:18px;color:var(--text);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.tool-card:hover{transform:translateY(-4px);border-color:#d2042d;box-shadow:0 18px 42px #0004,0 25px 38px -20px #d2042d99}
.tool-card:focus-visible{outline:3px solid var(--red);outline-offset:4px}
.tool-icon{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:block;width:78px;height:78px;overflow:hidden;border-radius:14px;border:1px solid #ff3657;background:radial-gradient(ellipse at 32% 18%,#ff6579 0%,#e30a31 24%,#a90020 62%,#520014 100%);box-shadow:inset 0 1px 2px #ffffff80,inset 0 -5px 10px #26000c99,0 0 0 2px #d2042d20;color:transparent;font-size:0}
.tool-icon::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(174deg,transparent 0px,rgba(255,180,190,.16) 1px,rgba(255,255,255,.04) 2px,transparent 4px,rgba(35,0,8,.18) 6px,transparent 8px),linear-gradient(115deg,transparent 0%,rgba(255,255,255,.18) 23%,transparent 39%,rgba(30,0,8,.2) 57%,rgba(255,80,105,.15) 72%,transparent 100%);mix-blend-mode:screen;pointer-events:none}
.tool-icon::after{content:"";position:absolute;inset:3px;border:1px solid #ff8a9a55;border-radius:10px;box-shadow:inset 0 0 8px #ff173d33;pointer-events:none}
.tool-card h2{font-size:23px;margin:0 0 10px;max-width:calc(100% - 100px)}
.tool-card p{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 24px;max-width:calc(100% - 100px)}
.tool-card h2{font-size:23px;margin:0 0 10px;max-width:calc(100% - 72px)}
.tool-card p{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 24px;max-width:calc(100% - 72px)}
.open-label{display:flex;align-items:center;gap:8px;margin-top:auto;color:#fff;font-size:14px;font-weight:700}
.arrow{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--red)}
.marcos-egg{cursor:pointer;border:0;background:none;color:inherit;font:inherit;padding:0;touch-action:manipulation}.marcos-egg:focus-visible{outline:2px solid #d2042d;outline-offset:3px;border-radius:3px}.confetti-piece{position:fixed;z-index:9999;pointer-events:none;width:8px;height:12px;left:0;top:0;animation:confetti-fall 1300ms ease-out forwards}.confetti-cascade{animation-timing-function:linear}@keyframes confetti-fall{0%{opacity:1;transform:translate(0,0) rotate(0deg)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--spin))}}@media(prefers-reduced-motion:reduce){.confetti-piece{animation-duration:450ms}}.footer{text-align:center;color:#737d8c;font-size:12px;margin-top:34px}.version{position:fixed;right:18px;bottom:12px;color:#737d8c;font-size:12px;pointer-events:none}
#toolFrame{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media(max-width:640px){#landing{align-items:flex-start;padding:36px 16px}.brand{margin-bottom:36px}.subtitle{margin-top:-23px;font-size:14px}.tools{grid-template-columns:1fr}.tool-card{min-height:210px;padding:23px}.tool-icon{right:20px;width:64px;height:64px}}

/* v1.7 — vidrio limpio, sin textura superpuesta */
.tool-card{
  background:linear-gradient(145deg,#252b35,#20242c)!important;
  border:1px solid rgba(255,255,255,.17)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 0 0 1px rgba(255,255,255,.025),0 12px 32px rgba(0,0,0,.16);
  -webkit-backdrop-filter:blur(24px) saturate(155%);
  backdrop-filter:blur(24px) saturate(155%);
  position:relative;
}
.tool-card::before{content:none!important}
.tool-card:hover{
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.025) 52%,rgba(255,255,255,.035)),rgba(34,34,45,.39)!important;
  border-color:rgba(255,255,255,.26)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.19),0 14px 34px rgba(210,4,45,.34),0 3px 10px rgba(255,25,65,.16);
}
.tool-icon{
  width:56px!important;height:56px!important;right:28px!important;
  border-radius:19px!important;overflow:hidden;display:block!important;
  background:linear-gradient(145deg,#ed1740 0%,#c9002a 54%,#85001d 100%)!important;
  border:1px solid rgba(255,110,135,.68)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 5px rgba(35,0,10,.20),0 5px 14px rgba(210,4,45,.16)!important;
  color:transparent!important;font-size:0!important;
}
.tool-icon::before{content:none!important}
.tool-icon::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
/* Ilustración de calculadora, limpia y geométrica, construida con CSS. */
.tool-card[data-tool="calculator"] .tool-icon::after{
  inset:13px 17px 12px 17px;border-radius:7px;
  background:
    linear-gradient(#ffe9ed,#ffe9ed) 50% 14%/28px 3px no-repeat,
    linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.88)) 50% 30%/35px 15px no-repeat,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 4px 45%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 16px 45%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 28px 45%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 4px 57%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 16px 57%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 28px 57%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 4px 69%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 16px 69%/12px 12px,
    radial-gradient(circle,#fff 0 2px,transparent 2.5px) 28px 69%/12px 12px,
    linear-gradient(rgba(255,255,255,.19),rgba(255,255,255,.19));
  background-repeat:no-repeat;border:1px solid rgba(255,255,255,.52);
  box-shadow:inset 0 1px 5px rgba(255,255,255,.10);
}
/* Regla con marcas de medición limpias, también generada con CSS. */
.tool-card[data-tool="ruler"] .tool-icon::after{
  inset:17px 9px 18px 9px;border-radius:3px;
  background:
    repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,255,255,.95) 5px 6px,transparent 6px 10px) left bottom/100% 12px no-repeat,
    repeating-linear-gradient(90deg,transparent 0 19px,rgba(255,255,255,.95) 19px 20px,transparent 20px 40px) left bottom/100% 20px no-repeat,
    linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.85)) left bottom/100% 1px no-repeat;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 1px rgba(70,0,15,.10);
}
@media(max-width:600px){
  .tool-icon{width:46px!important;height:46px!important;right:17px!important;border-radius:13px!important}
  .tool-card{-webkit-backdrop-filter:blur(12px) saturate(125%);backdrop-filter:blur(12px) saturate(125%)}
}


/* v1.1.0.1 — versión base estable; secuencia continua de ticks uniformes, sin huecos irregulares */
.tool-card h2{font-size:36px!important;line-height:1.12;max-width:66.6667%}
.tool-card p{max-width:66.6667%!important;text-align:left!important}
.tool-icon.calculator-icon::after{inset:0!important;border:0!important;background:none!important;box-shadow:none!important}
.math-corner{position:absolute;z-index:2;width:calc(50% - 8px);height:calc(50% - 8px);display:flex;align-items:center;justify-content:center;box-sizing:border-box;color:#fff;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-weight:600;font-size:30px;line-height:1;text-shadow:0 1px 2px #780018;pointer-events:none}
.math-tl{top:8px;left:8px}.math-tr{top:8px;right:8px}.math-bl{bottom:8px;left:8px;color:#8f001c!important;text-shadow:0 1px 1px rgba(255,150,170,.25)!important}.math-br{bottom:8px;right:8px}
.tool-card[data-tool="ruler"] .tool-icon::after{
  /* Solo el contorno es más grueso y tiene esquinas redondeadas; los ticks son uniformes y llegan a media altura. */
  inset:7px 5px!important;
  border:2px solid rgba(255,255,255,.82)!important;
  border-radius:7px!important;
  /* Un único patrón repetido: todos los ticks tienen 1 px de grosor y 6 px entre inicios.
     El pequeño margen inicial evita que el primer tick se funda con el contorno. */
  background:
    repeating-linear-gradient(90deg,transparent 0 1px,rgba(255,255,255,.98) 1px 2px,transparent 2px 6px) left bottom/100% 50% no-repeat!important;
  background-clip:padding-box!important;
  box-shadow:none!important;
}
.ruler-number{
  position:absolute;top:12px;z-index:2;color:#fff;font-family:Arial,sans-serif;
  font-size:10.5px;font-weight:700;line-height:1;text-shadow:0 1px 2px #780018;
  pointer-events:none;
}
.ruler-zero{left:9px}
.ruler-one{right:9px}
@media(max-width:600px){.ruler-number{font-size:8.625px;top:11px}.ruler-zero{left:8px}.ruler-one{right:8px}}

</style>

<body>
<main id="landing">
  <div class="landing-inner">
    <div class="brand"><h1>Herramientas estructurales</h1></div>
    <p class="subtitle">Utilidades para diseño y medición de empaques de cartón</p>
    <div class="tools" id="toolsMenu">
      <!-- Para agregar otra herramienta en el futuro: agrega otra tarjeta con data-tool y su entrada en TOOL_SOURCES. -->
      <button class="tool-card" type="button" data-tool="calculator">
        <span class="tool-icon calculator-icon" aria-hidden="true"><span class="math-corner math-tl">+</span><span class="math-corner math-tr">−</span><span class="math-corner math-bl">×</span><span class="math-corner math-br">÷</span></span>
        <h2>Calculadora</h2>
        <p>Calcula fracciones, pulgadas y milímetros, redondea medidas y guarda resultados importantes.</p>
      </button>
      <button class="tool-card" type="button" data-tool="ruler">
        <span class="tool-icon ruler-icon" aria-hidden="true"><span class="ruler-number ruler-zero">0</span><span class="ruler-number ruler-one">1</span></span>
        <h2>Regla</h2>
        <p>Mide sobre una regla en pulgadas, coloca marcadores y compara distancias visualmente.</p>
      </button>
    </div>
    <div class="footer">Herramientas de <button type="button" class="marcos-egg" id="marcosEgg" aria-label="Marcos">Marcos</button> para CTP</div>
  </div>
  <div class="version">v1.1.0.1</div>
</main>
<iframe id="toolFrame" title="Herramienta seleccionada"></iframe>

// Easter egg local: confeti temporal al pulsar "Marcos".
document.getElementById('marcosEgg').addEventListener('click', event => {
  const rect = event.currentTarget.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;
  const colors = ['#d2042d', '#ffd166', '#65d6a1', '#70b8ff', '#f78ad1', '#ffffff'];
  // Explosión original desde la palabra «Marcos» (se conserva sin cambios).
  for (let i = 0; i < 65; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';
    piece.style.left = x + 'px';
    piece.style.top = y + 'px';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.setProperty('--dx', ((Math.random() - .5) * 520) + 'px');
    piece.style.setProperty('--dy', (80 + Math.random() * 360) + 'px');
    piece.style.setProperty('--spin', ((Math.random() - .5) * 1100) + 'deg');
    piece.style.animationDelay = (Math.random() * 160) + 'ms';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove(), {once:true});
    setTimeout(() => piece.remove(), 1800);
  }

  // Cascada adicional: confeti distribuido por todo el ancho y cayendo
  // desde arriba hasta abajo de la pantalla durante aproximadamente 1.5 s.
  const screenWidth = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
  const screenHeight = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
  for (let i = 0; i < 100; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece confetti-cascade';
    piece.style.left = (Math.random() * screenWidth) + 'px';
    piece.style.top = '-16px';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.setProperty('--dx', ((Math.random() - .5) * 100) + 'px');
    piece.style.setProperty('--dy', (screenHeight + 40) + 'px');
    piece.style.setProperty('--spin', ((Math.random() - .5) * 900) + 'deg');
    piece.style.animationDelay = (Math.random() * 180) + 'ms';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove(), {once:true});
    setTimeout(() => piece.remove(), 1800);
  }
});
const landing = document.getElementById('landing');
const frame = document.getElementById('toolFrame');
function decodeTool(encoded) {
  const binary = atob(encoded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function openTool(name) {
  if (!Object.prototype.hasOwnProperty.call(TOOL_SOURCES, name)) return;
  // iOS: escribir directamente en el iframe evita restricciones de srcdoc
  // cuando el HTML se abre desde Archivos / file://.
  landing.style.display = 'none';
  frame.style.display = 'block';
  const doc = frame.contentWindow.document;
  doc.open();
  doc.write(decodeTool(TOOL_SOURCES[name]));
  doc.close();
  frame.title = name === 'calculator' ? 'Calculadora de medidas' : 'Regla interactiva';
}
function goHome() {
  const doc = frame.contentWindow.document;
  doc.open();
  doc.write('<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>');
  doc.close();
  frame.style.display = 'none';
  landing.style.display = 'flex';
  document.title = 'Herramientas estructurales';
}
document.querySelectorAll('[data-tool]').forEach(button => {
  button.addEventListener('click', () => openTool(button.dataset.tool));
});
window.addEventListener('message', event => {
  if (event.data && event.data.type === 'structural-tools-go-home') goHome();
});
window.addEventListener('keydown', event => {
  if (event.key === 'Escape' && frame.style.display === 'block') goHome();
});
</script>
